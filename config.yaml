# GNN-BERT Music Context Understanding - Configuration

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  annotations_zip: "annotations.zip"
  features_zip: "features.zip"
  audio_zip: "audio.zip"

audio:
  sr: 22050
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  segment_duration: 2.0

graph:
  similarity_threshold: 0.7
  max_edges_per_node: 10
  node_feature_dim: 260

bert:
  model_name: "bert-base-uncased"
  max_length: 128
  hidden_dim: 768
  freeze_layers: 12

gnn:
  hidden_dims: [128, 64, 32]
  num_layers: 3
  dropout: 0.3
  aggregation: "mean"
  model_type: "graphsage"

fusion:
  cross_attention_heads: 4
  fused_dim: 128
  alpha: 0.3
  beta: 0.3

contrastive:
  embedding_dim: 256
  temperature: 0.07
  projection_dim: 256

training:
  batch_size: 64
  lr: 2.0e-4
  bert_lr: 2.0e-5
  epochs: 5
  patience: 5
  weight_decay: 1.0e-4
  scheduler: "cosine"

tags:
  mood_tags: ['happy', 'sad', 'angry', 'relaxed', 'energetic', 'calm', 'tense', 'peaceful']
  genre_tags: ['electronic', 'classical', 'rock', 'ambient', 'pop', 'jazz', 'folk', 'metal']
